<script>
(function(){

var SN=["beep","chime","pulse"],LN=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications,syncT;

$("pv").onclick=function(){
if(!n.pv){if(!S.pin||!KEY){alert("Set a PIN first on the Home tab, under Security.");return}
Promise.all((cur.a||[]).map(function(a){return fget(a.id).then(function(v){return fputE(a.id,v.blob,a.name,a.type)})})).then(function(){return enc({t:cur.t,b:cur.b,a:cur.a||[]})}).then(function(e){n.enc=e;n.t="";n.b="";n.a=[];n.pv=true;save();render()})}
else{Promise.all((cur.a||[]).map(function(a){return fget(a.id).then(function(v){return fput(a.id,{blob:v.blob,name:a.name,type:a.type})})})).then(function(){n.t=cur.t;n.b=cur.b;n.a=cur.a||[];delete n.enc;n.pv=false;save();render()})}}}

/* UNIVERSAL SEARCH — PHASE 1 */
function searchView(){
  $("app").innerHTML=hdr("Search",{back:1,noS:1})+
    '<div class="card" style="margin-top:0">'+
      '<div class="row">'+
        '<input id="qi" type="search" autocomplete="off" placeholder="Search anything…">'+
        '<button class="ghost" id="qclear" aria-label="Clear search">✕</button>'+
      '</div>'+
      '<div class="chips wrap" id="qfilters">'+
        '<button class="chip on" data-qk="all">All</button>'+
        '<button class="chip" data-qk="notes">Notes</button>'+
        '<button class="chip" data-qk="recordings">Recordings</button>'+
        '<button class="chip" data-qk="tasks">Tasks</button>'+
        '<button class="chip" data-qk="reminders">Reminders</button>'+
        '<button class="chip" data-qk="schedule">Schedule</button>'+
      '</div>'+
      '<div class="hint">Search across everything saved in Universal AI Notebook.</div>'+
    '</div>'+
    '<div id="res"></div>';

  var filter="all";

  function norm(v){
    return String(v||"").toLowerCase().replace(/\s+/g," ").trim();
  }

  function escQ(v){
    return esc(String(v||""));
  }

  function termsFor(v){
    return norm(v).split(" ").filter(function(x){return x.length>1});
  }

  function hayFor(item,type){
    var h=[];

    if(type==="notes"){
      h.push(item.t,item.b);
      (item.a||[]).forEach(function(a){
        h.push(a.name,a.type);
      });
    }else if(type==="recordings"){
      h.push(item.t,item.k);
      /*
       * Phase 2 will add item.transcript and item.summary here.
       * Keeping the fields optional makes this search forward-compatible.
       */
      h.push(item.transcript,item.summary);
    }else if(type==="tasks"){
      h.push(item.t,item.w);
    }else if(type==="reminders"){
      h.push(item.t,item.w);
    }else if(type==="schedule"){
      h.push(item.t,item.d,item.tm,item.w);
    }

    return norm(h.join(" "));
  }

  function score(item,type,terms,raw){
    var h=hayFor(item,type);
    if(!h)return 0;

    var s=0;
    terms.forEach(function(t){
      if(h.indexOf(t)>-1)s+=1;
    });

    /* Exact phrase gets a bonus. */
    if(raw && h.indexOf(raw)>-1)s+=2;

    /* Title matches are more useful than body matches. */
    var title=norm(item.t);
    terms.forEach(function(t){
      if(title.indexOf(t)>-1)s+=2;
    });

    return s;
  }

  function preview(item,type){
    if(type==="notes")return item.b||"Note";
    if(type==="recordings"){
      return item.summary||item.transcript||"Audio recording";
    }
    if(type==="tasks")return item.done?"Completed task":"Task";
    if(type==="reminders")return item.done?"Completed reminder":"Reminder";
    if(type==="schedule")return (item.d||"")+" "+(item.tm||"");
    return "";
  }

  function when(item,type){
    if(type==="notes")return item.ts?fmt(item.ts):"";
    if(type==="recordings")return item.at?fmt(item.at):"";
    if(type==="reminders")return item.at?fmt(item.at):"";
    if(type==="schedule")return (item.d||"")+" "+(item.tm||"");
    return "";
  }

  function iconFor(type){
    if(type==="notes")return ic("file");
    if(type==="recordings")return ic("mic");
    if(type==="tasks")return ic("check");
    if(type==="reminders")return ic("bell");
    if(type==="schedule")return ic("calendar");
    return ic("search");
  }

  function clsFor(type){
    return {
      notes:"g1",
      recordings:"g2",
      tasks:"g3",
      reminders:"g4",
      schedule:"g5"
    }[type]||"g1";
  }

  function resultCard(r){
    var x=r.item;
    var done=(r.type==="tasks"||r.type==="reminders")&&x.done;
    return '<button class="item '+(done?'done ':'')+
      '" style="width:100%;text-align:left;border:1px solid var(--line);color:var(--ink)" '+
      'data-sopen="'+escQ(x.id||"")+'" data-stype="'+r.type+'">'+
      '<span class="ico '+clsFor(r.type)+'">'+iconFor(r.type)+'</span>'+
      '<span class="grow" style="min-width:0">'+
        '<b>'+escQ(x.t||"Untitled")+'</b>'+
        '<span class="meta">'+escQ(r.label)+' · '+escQ(when(x,r.type))+'</span>'+
        '<span class="pre">'+escQ(preview(x,r.type))+'</span>'+
      '</span>'+
      '<span class="chev">›</span>'+
    '</button>';
  }

  function collect(raw){
    var terms=termsFor(raw),out=[];

    if(!terms.length)return out;

    var groups=[
      ["notes",S.notes||[],"Notes"],
      ["recordings",S.rec||[],"Recordings"],
      ["tasks",S.tasks||[],"Tasks"],
      ["reminders",S.rem||[],"Reminders"],
      ["schedule",S.ev||[],"Schedule"]
    ];

    groups.forEach(function(g){
      if(filter!=="all"&&filter!==g[0])return;

      g[1].forEach(function(item){
        /*
         * Private notes stay excluded from search while locked.
         * The existing app already uses KEY to unlock encrypted notes.
         */
        if(g[0]==="notes"&&item.pv)return;

        var sc=score(item,g[0],terms,norm(raw));
        if(sc>0){
          out.push({
            item:item,
            type:g[0],
            label:g[2],
            score:sc
          });
        }
      });
    });

    return out.sort(function(a,b){
      if(b.score!==a.score)return b.score-a.score;

      var at=a.item.ts||a.item.at||0;
      var bt=b.item.ts||b.item.at||0;
      return bt-at;
    });
  }

  function run(){
    var raw=$("qi").value.trim();
    var box=$("res");

    if(!raw){
      box.innerHTML=
        '<div class="card">'+
          '<div class="hero" style="margin:0;cursor:default">'+
            '<span class="ico g3">'+ic("search")+'</span>'+
            '<div class="grow">'+
              '<b>Search your notebook</b>'+
              '<div class="pre">Notes, recordings, tasks, reminders and schedule.</div>'+
            '</div>'+
          '</div>'+
          '<p class="hint">Try: cement, meeting, SIWES, report, client, tomorrow…</p>'+
        '</div>';
      return;
    }

    var results=collect(raw);

    if(!results.length){
      box.innerHTML=
        '<div class="empty">'+
          '<div style="font-size:2rem;margin-bottom:6px">⌕</div>'+
          'Nothing found for “'+escQ(raw)+'”.'+
          '<div class="hint">Try another word or switch the filter to All.</div>'+
        '</div>';
      return;
    }

    var counts={notes:0,recordings:0,tasks:0,reminders:0,schedule:0};
    results.forEach(function(r){counts[r.type]++;});

    var summary='<div class="hint" style="margin:14px 2px 8px">'+
      results.length+' result'+(results.length===1?'':'s')+
      ' found</div>';

    box.innerHTML=summary+
      results.map(resultCard).join("");
  }

  $("qi").oninput=run;

  $("qclear").onclick=function(){
    $("qi").value="";
    $("qi").focus();
    run();
  };

  $("qfilters").onclick=function(e){
    var b=e.target.closest("[data-qk]");
    if(!b)return;

    filter=b.getAttribute("data-qk");

    Array.prototype.forEach.call(
      $("qfilters").querySelectorAll("[data-qk]"),
      function(x){x.classList.toggle("on",x===b);}
    );

    run();
  };

  $("app").onclick=function(e){
    var b=e.target.closest("[data-sopen]");
    if(!b)return;

    var id=b.getAttribute("data-sopen");
    var type=b.getAttribute("data-stype");

    /*
     * Notes can open directly using the existing note editor.
     * Other record types are currently informational results.
     * Later phases can add direct navigation to each object.
     */
    if(type==="notes"){
      tab="notes";
      openId=id;
      render();
    }else if(type==="tasks"){tab="tasks";openId=null;moreSub=null;render();
    }else if(type==="recordings"){tab="rec";openId=null;moreSub=null;render();
    }else if(type==="reminders"){tab="more";moreSub="rem";render();
    }else if(type==="schedule"){var ev=S.ev.filter(function(x){return x.id===id})[0];if(ev){calSel=ev.d;calM=new Date(ev.d+"T00:00");calM.setDate(1)}tab="more";moreSub="cal";render();
    }
  };

  $("qi").focus();
  run();
}

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
cleanCache();
var hid=0;document.addEventListener("visibilitychange",function(){if(document.hidden){hid=Date.now()}else if(S.pin&&hid&&Date.now()-hid>20000){showLock()}});

setTimeout(function(){$("splash").classList.add("out")},1300);
if(S.pin)showLock();
render();sync();
})();
</script>
