<html lang="en">
<head>

<title>Universal AI Notebook</title>
<style>

[data-bg=modern] body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(70% 40% at 100% 0,var(--glow),transparent 70%),radial-gradient(60% 40% at 0 100%,var(--glow),transparent 70%)}
#app{max-width:640px;margin:0 auto;padding:14px 16px 112px}

.chip{flex:none;padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:600}

.sw:checked{background:var(--acc)}.sw:checked:after{transform:translateX(20px)}

.greet{display:flex;gap:12px;align-items:center;margin:4px 0 12px}

.greet b{font-size:1.2rem;display:block}
.hero{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(135deg,var(--glow),var(--card));margin:10px 0;cursor:pointer}
.stats{display:flex;align-items:center;gap:12px}

.ring{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.qt{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:.82rem;animation:rise .45s both;cursor:pointer}
.qt:nth-child(2){animation-delay:.05s}.qt:nth-child(3){animation-delay:.1s}.qt:nth-child(4){animation-delay:.15s}.qt:nth-child(5){animation-delay:.2s}.qt:nth-child(6){animation-delay:.25s}
.qt:active{transform:scale(.93)}.qt .ico{width:48px;height:48px;border-radius:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.tile{background:var(--card2);border-radius:14px;padding:12px}.tile b{display:block;font-size:1.6rem;font-weight:800}.tile span{color:var(--mute);font-size:.85rem}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{font-size:.75rem;color:var(--mute);padding:4px 0}
.d{aspect-ratio:1;border-radius:50%;border:0;background:none;color:var(--ink);position:relative;padding:0}
.d.today{background:var(--acc);color:var(--accink);font-weight:800}.d.sel{box-shadow:0 0 0 2px var(--acc) inset}
.d i{position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--acc)}.d.today i{background:var(--accink)}
.ev{border-left:4px solid var(--c)}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tc{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:10px;text-align:left;position:relative}

.tp{display:flex;gap:4px;height:54px;border-radius:12px;padding:8px;align-items:flex-end;margin-bottom:6px}
.tp i{flex:1;height:100%;border-radius:4px;background:#2DE0C7}.tp i:nth-child(2){height:60%;opacity:.55}.tp i:nth-child(3){height:35%;opacity:.35}
.tc[data-tcol=dark] .tp{background:#0A1517}.tc[data-tcol=light] .tp{background:#F1F7F6}.tc[data-tcol=light] .tp i{background:#12B8A3}.tc[data-tcol=blue] .tp{background:#091033}.tc[data-tcol=blue] .tp i{background:#4DA3FF}.tc[data-tcol=purple] .tp{background:#130A2C}.tc[data-tcol=purple] .tp i{background:#B06BFF}
.sds{display:flex;gap:8px}.sd{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0;font-size:.8rem}.sd.on{border-color:var(--ink);transform:scale(1.15)}
.sbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}.sbar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .8s}
.bub{max-width:86%;padding:10px 14px;border-radius:18px;margin:8px 0;background:var(--card);border:1px solid var(--line);animation:rise .3s both}
.bub.me{margin-left:auto;background:var(--acc);color:var(--accink);border-color:transparent}
.typing{display:flex;gap:4px;width:64px}.typing i{width:8px;height:8px;border-radius:50%;background:var(--mute);animation:wv2 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.compose{position:sticky;bottom:90px;display:flex;gap:8px;padding-top:10px;background:linear-gradient(transparent,var(--bg) 30%)}
.wave{display:flex;gap:5px;height:44px;align-items:center;justify-content:center}
.wave i{width:5px;border-radius:3px;background:var(--acc);animation:wv 1s ease-in-out infinite}.wave i:nth-child(2n){animation-delay:.15s}.wave i:nth-child(3n){animation-delay:.3s}
.timer{font-size:2rem;font-weight:800;display:block;text-align:center;margin:6px 0}
.live{text-align:center;border-color:var(--acc);box-shadow:0 0 28px var(--glow)}.live .row{justify-content:center}
.rb{animation:ring 2.4s infinite}
.bar{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.rec{background:var(--bad);color:#fff;border-color:var(--bad)}
textarea{min-height:44vh;resize:vertical;line-height:1.5}
.att img{max-width:100%;border-radius:12px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{display:flex;max-width:640px;margin:0 auto;padding:6px}

nav button.on{color:var(--acc);background:var(--glow)}nav button.on svg{animation:pop .4s}
#banner{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);max-width:616px;margin:0 auto;background:var(--acc);color:var(--accink);border-radius:16px;padding:12px 14px;display:none;z-index:40;animation:drop .3s both;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#banner .row{margin-top:8px}#banner button{background:var(--accink);color:var(--acc);border:0;border-radius:12px;padding:8px 14px;font-weight:700}
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .5s,visibility .5s}
#splash.out{opacity:0;visibility:hidden}
.sl{text-align:center}.sg{display:inline-grid;place-items:center;width:84px;height:84px;border-radius:22px;animation:pop .9s both;box-shadow:0 14px 34px rgba(59,99,245,.35)}.sg svg{width:84px;height:84px}
.sn{font-size:1.9rem;line-height:1.1;padding:0 12px;font-weight:800;letter-spacing:-.03em;margin-top:14px;animation:rise .7s .2s both}.stg{color:var(--mute);margin-top:6px;animation:rise .7s .4s both}
.ld{width:120px;height:4px;border-radius:9px;background:var(--line);margin:22px auto 0;overflow:hidden}.ld i{display:block;height:100%;background:var(--acc);animation:load 1.2s ease-in-out both}
.cf{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:60;animation:cf .8s ease-out forwards}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:60;font-weight:600;animation:rise .3s both}
#lock{position:fixed;inset:0;background:#000;color:#fff;z-index:30;display:none}
.ls{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 24px calc(env(safe-area-inset-bottom,0px) + 18px);position:relative;overflow:hidden}
.lt{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.lbk{background:none;border:0;color:#fff;padding:6px 8px 6px 0}.lbk svg{width:26px;height:26px}
.lhelp{background:none;border:0;color:#8e8e93;font-size:.9rem;padding:8px 0}
.lbody{margin-top:5vh;transition:filter .45s,opacity .45s}.lbody.blur{filter:blur(14px);opacity:.45}
.lill{display:block;width:150px;margin:0 auto 18px}.lill .bub2{transform-origin:62px 40px;animation:pop .5s both}
.ltitle{font-size:2rem;font-weight:800;margin:0 0 6px;color:#fff;letter-spacing:-.02em}
.lsub{color:#8e8e93;font-size:.9rem;margin:0 0 22px}.lsub b{color:#fff}
.boxes{display:flex;gap:10px}

.bx.f{animation:pop .25s}.bx.act{border-color:#E0A800}
.bx.er{border-color:#E5484D;background:#1d0b0d}
.cur{width:2px;height:26px;background:#E0A800;animation:blink 1s steps(2,start) infinite}
.shake{animation:shake .45s}
.lerr{color:#E5484D;font-size:.85rem;margin-top:12px;min-height:1.3em;display:flex;gap:6px;align-items:center}.lerr svg{width:16px;height:16px}
.lbio{margin-top:28px;background:#1c1c1e;border:0;color:#fff;border-radius:14px;padding:12px 16px;display:inline-flex;gap:8px;align-items:center}

.lover{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-weight:600}.lover.on{display:flex;animation:rise .3s both}
.dots{display:flex;gap:10px;height:30px;align-items:center}.dots i{width:12px;height:12px;border-radius:50%;animation:hop .9s ease-in-out infinite}
.dots i:nth-child(1){background:#EA4335}.dots i:nth-child(2){background:#4285F4;animation-delay:.1s}.dots i:nth-child(3){background:#34A853;animation-delay:.2s}.dots i:nth-child(4){background:#FBBC05;animation-delay:.3s}.dots i:nth-child(5){background:#FF8A3D;animation-delay:.4s}
.vb{width:88px;height:88px;border-radius:50%;background:#FFB400;display:grid;place-items:center;animation:pop .5s both;transition:background .4s}
.vb svg{width:40px;height:40px;stroke:#111;stroke-width:2.4;animation:spinin .7s both}.vb.ok{background:#34C759}.vb.ok svg{stroke:#fff}
@keyframes blink{50%{opacity:0}}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes hop{0%,100%{transform:translateY(7px)}50%{transform:translateY(-9px)}}
@keyframes spinin{from{transform:rotate(-120deg) scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}

@keyframes bob{50%{transform:translateY(-4px) rotate(10deg)}}
@keyframes drop{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:none}}
@keyframes wv{0%,100%{height:8px}50%{height:40px}}
@keyframes wv2{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
@keyframes load{from{width:0}to{width:100%}}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===== v2 design system: navy / royal blue / purple ===== */
:root{--bg:#F5F7FC;--card:#fff;--card2:#EEF2FB;--ink:#0E1736;--mute:#6A7597;--line:#E2E8F5;--acc:#3B63F5;--acc2:#7C4DFF;--accink:#fff;--bad:#E5484D;--ok:#12B76A;--glow:rgba(59,99,245,.10);--grad:linear-gradient(135deg,var(--acc),var(--acc2));--sh:0 6px 20px rgba(20,35,90,.07)}
[data-theme=light]{--bg:#F5F7FC;--card:#fff;--card2:#EEF2FB;--ink:#0E1736;--mute:#6A7597;--line:#E2E8F5;--acc:#3B63F5;--acc2:#7C4DFF;--accink:#fff;--bad:#E5484D;--glow:rgba(59,99,245,.10);--sh:0 6px 20px rgba(20,35,90,.07)}
[data-theme=dark]{--bg:#0A1030;--card:#121A44;--card2:#1A2458;--ink:#EDF0FF;--mute:#9AA5D4;--line:#232E66;--acc:#5B82FF;--acc2:#9B6BFF;--accink:#fff;--bad:#FF6B72;--glow:rgba(124,77,255,.18);--sh:0 8px 24px rgba(0,0,0,.35)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.card,.item{box-shadow:var(--sh);border-radius:20px}
.item{border-radius:18px}
.hdr h1{font-weight:800}
.logo{background:none;width:auto;height:auto;display:inline-flex}
.btn{background:var(--grad);color:#fff;box-shadow:0 8px 18px rgba(59,99,245,.28)}
.btn:disabled{opacity:.6}
.ghost{background:var(--card);box-shadow:none}
.ib.acc{background:var(--grad);color:#fff;border-color:transparent}
.chip{background:var(--card);box-shadow:none}
.chip.on{background:var(--grad);color:#fff}
.chk:checked{background:var(--acc);border-color:var(--acc)}
.sw:checked{background:var(--acc)}
.ico{background:rgba(var(--cr,59,99,245),.13);color:rgb(var(--cr,59,99,245))}
.g1{--cr:16,185,129}.g2{--cr:139,92,246}.g3{--cr:59,130,246}.g4{--cr:245,158,11}.g5{--cr:99,102,241}.g6{--cr:239,68,68}

/* TRASH */
var TL={note:"notes",task:"tasks",rec:"rec",rem:"rem",ev:"ev"},TT={note:["Note","note","g3"],task:["Task","check","g4"],rec:["Recording","mic","g2"],rem:["Reminder","bell","g6"],ev:["Event","cal","g5"]};
function toTrash(type,id){var l=S[TL[type]],it=l.filter(function(x){return x.id===id})[0];if(!it)return;S[TL[type]]=l.filter(function(x){return x!==it});S.trash.push({type:type,item:it,del:Date.now()});save();toast("Moved to Trash")}
function purgeEntry(e){if(e.type==="rec")fdel(e.item.id);if(e.type==="note"){if(e.item.pv){if(KEY&&e.item.enc)dec(e.item.enc).then(function(p){(p.a||[]).forEach(function(a){fdel(a.id)})}).catch(function(){})}else(e.item.a||[]).forEach(function(a){fdel(a.id)})}}
function purgeOld(){var lim=Date.now()-30*864e5,keep=[];S.trash.forEach(function(e){if(e.del<lim&&!(e.type==="note"&&e.item.pv&&!KEY))purgeEntry(e);else keep.push(e)});if(keep.length!==S.trash.length){S.trash=keep;save()}}
function trashView(){purgeOld();
var L=S.trash.slice().sort(function(a,b){return b.del-a.del});
$("app").innerHTML=hdr("Trash",{back:1,noS:1})+'<p class="sub">Deleted items stay here for 30 days. Private notes stay encrypted.</p>'+(L.length?'<button class="ghost" id="te" style="margin-bottom:6px">Empty trash</button>':'')+
(L.length?L.map(function(e){var t=TT[e.type],it=e.item,left=Math.max(0,30-Math.floor((Date.now()-e.del)/864e5)),key=e.type+":"+it.id;return '<div class="item col"><div class="row" style="width:100%"><span class="ico '+t[2]+'">'+ic(t[1])+'</span><div class="grow"><b>'+esc(e.type==="note"&&it.pv?"Private note":(it.t||"Untitled"))+'</b><span class="pre">'+t[0]+' · deleted '+ago(e.del)+' · '+left+' days left</span></div></div><div class="row"><button class="ghost" data-rs="'+key+'">Restore</button><button class="ghost" data-df="'+key+'">Delete forever</button></div></div>'}).join(""):'<p class="empty">Trash is empty.</p>');
function ent(k){var a=k.split(":");return S.trash.filter(function(e){return e.type===a[0]&&e.item.id===a[1]})[0]}
var te=$("te");if(te)te.onclick=function(){if(confirm("Delete everything in Trash forever?")){S.trash.forEach(purgeEntry);S.trash=[];save();trashView()}};
$("app").onclick=function(ev){var rs=ev.target.closest("[data-rs]"),df=ev.target.closest("[data-df]");
if(rs){var e=ent(rs.getAttribute("data-rs"));if(e){S[TL[e.type]].push(e.item);S.trash=S.trash.filter(function(x){return x!==e});save();toast("Restored");trashView()}}
if(df&&confirm("Delete this forever?")){var d=ent(df.getAttribute("data-df"));if(d){purgeEntry(d);S.trash=S.trash.filter(function(x){return x!==d});save();trashView()}}};
}

/* ENCRYPTED BACKUP */
function pwDialog(title,sub,two,cb){var d=document.createElement("div");d.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45;display:grid;place-items:center;padding:20px";
d.innerHTML='<div class="card" style="width:100%;max-width:380px"><b>'+title+'</b><p class="hint">'+sub+'</p><input id="pw1" type="password" placeholder="Password" style="margin:8px 0"><input id="pw2" type="password" placeholder="Repeat password" style="margin-bottom:8px;display:'+(two?"block":"none")+'"><div class="row"><button class="ghost" id="pwc">Cancel</button><button class="btn" id="pwo">OK</button></div><div class="late" id="pwe" style="margin-top:6px"></div></div>';
document.body.appendChild(d);$("pw1").focus();$("pwc").onclick=function(){d.remove()};
$("pwo").onclick=function(){var a=$("pw1").value;if(a.length<6){$("pwe").textContent="Use at least 6 characters.";return}if(two&&a!==$("pw2").value){$("pwe").textContent="Passwords do not match.";return}d.remove();cb(a)}}
function pwKey(pw,salt,use){return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(m){return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:200000,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,[use])})}
function ab2b64(buf){var u=new Uint8Array(buf),t="",i;for(i=0;i<u.length;i+=32768)t+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(t)}
function blob2b64(bl){return new Promise(function(res){var r=new FileReader();r.onload=function(){res(String(r.result).split(",")[1]||"")};r.readAsDataURL(bl)})}
function idbAll(){return idb().then(function(d){return new Promise(function(res,rej){var out=[],q=d.transaction("f").objectStore("f").openCursor();q.onsuccess=function(){var c=q.result;if(c){out.push({k:c.key,v:c.value});c.continue()}else res(out)};q.onerror=function(){rej(q.error)}})})}
function exportBackup(pw){toast("Preparing backup…");
idbAll().then(function(all){return Promise.all(all.map(function(e){var v=e.v;if(v&&v.enc)return{k:e.k,enc:1,iv:ab2b64(v.iv),ct:ab2b64(v.ct),type:v.type};return blob2b64(v.blob).then(function(b){return{k:e.k,type:v.type,name:v.name,b:b}})}))}).then(function(files){
var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
return pwKey(pw,salt,"encrypt").then(function(k){return crypto.subtle.encrypt({name:"AES-GCM",iv:iv},k,new TextEncoder().encode(JSON.stringify({v:1,at:Date.now(),s:S,files:files})))}).then(function(ct){var out=new Uint8Array(33+ct.byteLength);out.set(new TextEncoder().encode("UAIN1"),0);out.set(salt,5);out.set(iv,21);out.set(new Uint8Array(ct),33);return out})}).then(function(out){
var name="UniversalAINotebook-backup-"+ds(new Date())+".uain",FS=P("Filesystem"),SH=P("Share");
if(FS&&SH){return FS.writeFile({path:name,data:ab2b64(out),directory:"CACHE"}).then(function(w){return SH.share({title:"Universal AI Notebook backup",files:[w.uri]}).catch(function(){})}).then(function(){setTimeout(function(){FS.deleteFile({path:name,directory:"CACHE"}).catch(function(){})},600000)})}
var u=URL.createObjectURL(new Blob([out],{type:"application/octet-stream"})),a=document.createElement("a");a.href=u;a.download=name;a.click()}).then(function(){S.lastBk=Date.now();save();toast("Backup ready")}).catch(function(){alert("Could not create the backup.")})}
function restoreBackup(){var i=document.createElement("input");i.type="file";i.accept="*/*";i.onchange=function(){var f=i.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var u=new Uint8Array(r.result);
if(String.fromCharCode.apply(null,u.subarray(0,5))!=="UAIN1"){alert("This is not a Universal AI Notebook backup.");return}
pwDialog("Backup password","Enter the password you chose when you exported this backup.",false,function(pw){
pwKey(pw,u.slice(5,21),"decrypt").then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(21,33)},k,u.slice(33))}).then(function(pt){var d=JSON.parse(new TextDecoder().decode(pt));
if(!confirm("Restoring replaces everything on this phone with the backup ("+(d.s.notes||[]).length+" notes, "+(d.s.tasks||[]).length+" tasks). Continue?"))return;
return idb().then(function(db){return new Promise(function(res,rej){var t=db.transaction("f","readwrite"),st=t.objectStore("f");st.clear();d.files.forEach(function(e){st.put(e.enc?{enc:1,iv:ub64(e.iv),ct:ub64(e.ct).buffer,type:e.type}:{blob:new Blob([ub64(e.b)],{type:e.type}),name:e.name,type:e.type},e.k)});t.oncomplete=res;t.onerror=function(){rej(t.error)}})}).then(function(){localStorage.setItem(SKEY,JSON.stringify(d.s));location.reload()})}).catch(function(){alert("Could not open the backup. Check the password and the file.")})})};r.readAsArrayBuffer(f)};i.click()}
function backupView(){
$("app").innerHTML=hdr("Backup and restore",{back:1,noS:1})+'<div class="card"><div class="row"><span class="ico g3">'+ic("cloud")+'</span><div class="grow"><b>Encrypted backup</b><span class="pre">Saves notes, tasks, recordings, attachments and settings in one file locked with a password you choose.</span></div></div><button class="btn full" id="bx1">Export encrypted backup</button><button class="ghost" id="bx2" style="width:100%;margin-top:8px;justify-content:center">Restore from backup</button><p class="hint">Keep the password safe. Without it the backup cannot be opened. Recordings make the file larger.</p></div>';

/* UNIVERSAL SEARCH */
function searchView(){
var filter="all",KINDS=[["all","All"],["notes","Notes"],["tasks","Tasks"],["files","Files"],["recordings","Recordings"],["chats","AI chats"],["reminders","Reminders"],["schedule","Schedule"]];
$("app").innerHTML=hdr("Universal Search",{back:1,noS:1})+'<div class="sb2">'+ic("search")+'<input id="qi" type="search" autocomplete="off" placeholder="Search anything..." value="'+esc(q)+'" aria-label="Search anything">'+(canListen()?'<button class="mic" id="qmic" aria-label="Voice search">'+ic("mic")+'</button>':'')+'</div><div style="height:10px"></div><div class="chips" id="qf">'+KINDS.map(function(k,i){return '<button class="chip'+(i?'':' on')+'" data-qk="'+k[0]+'">'+k[1]+'</button>'}).join("")+'</div><div id="res"></div>';
function norm(v){return String(v||"").toLowerCase().replace(/\s+/g," ").trim()}
function rx(t){return t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
function snip(text,terms){var t=String(text||"").replace(/\s+/g," ").trim(),l=t.toLowerCase(),at=-1;terms.forEach(function(x){var i=l.indexOf(x);if(i>-1&&(at<0||i<at))at=i});
var a=Math.max(0,(at<0?0:at)-30),out=t.slice(a,a+110);if(a>0)out="…"+out;var h=esc(out);terms.forEach(function(x){h=h.replace(new RegExp("("+rx(esc(x))+")","ig"),"<mark>$1</mark>")});return h}
function remember(v){v=v.trim();if(!v)return;S.recent=(S.recent||[]).filter(function(x){return x.toLowerCase()!==v.toLowerCase()});S.recent.unshift(v);S.recent=S.recent.slice(0,8);save()}
var SRC={notes:["Notes","note","g3"],tasks:["Tasks","check","g4"],files:["Files","clip","g1"],recordings:["Recordings","mic","g2"],chats:["AI chat","spark","g2"],reminders:["Reminders","bell","g6"],schedule:["Schedule","cal","g5"]};
function collect(raw){var terms=norm(raw).split(" ").filter(function(x){return x.length>1}),out=[];if(!terms.length)return{out:out,terms:terms};
function add(type,id,title,text,when,extra){var h=norm(title+" "+text);if(!h)return;var sc=0,tl=norm(title);terms.forEach(function(t){if(h.indexOf(t)>-1)sc++;if(tl.indexOf(t)>-1)sc+=2});if(norm(raw)&&h.indexOf(norm(raw))>-1)sc+=2;if(sc>0&&(filter==="all"||filter===type))out.push({type:type,id:id,title:title||"Untitled",text:text,when:when||"",score:sc,extra:extra||""})}
S.notes.forEach(function(n){if(n.pv)return;add("notes",n.id,n.t,n.b,fmt(n.ts));(n.a||[]).forEach(function(a){add("files",n.id,a.name,"In note: "+(n.t||"Untitled"),fmt(n.ts))})});
S.tasks.forEach(function(t){add("tasks",t.id,t.t,(t.done?"Completed task":"Task")+(t.due?" · "+dueTxt(t):""),"")});
S.rec.forEach(function(r){add("recordings",r.id,r.t,[r.transcript,r.summary,(r.items||[]).join(" ")].join(" "),fmt(r.at))});
chatArr().forEach(function(m,i){if(!m.me)add("chats",String(i),plainTxt(m.t).slice(0,60),m.t,fmt(m.ts||Date.now()))});
S.rem.forEach(function(r){add("reminders",r.id,r.t,r.done?"Completed reminder":"Reminder",fmt(r.at))});
S.ev.forEach(function(e){add("schedule",e.id,e.t,(e.d||"")+" "+(e.tm||"")+" "+(e.loc||""),(e.d||"")+" "+fmtT(e.tm||"00:00"),e.d)});
out.sort(function(a,b){return b.score-a.score});return{out:out,terms:terms}}
function run(){var raw=$("qi").value;q=raw;var box=$("res");
if(!raw.trim()){var rc=S.recent||[];box.innerHTML=rc.length?'<div class="row"><h2 class="grow">Recent Searches</h2><button class="x" id="rclr">Clear</button></div>'+rc.map(function(x){return '<div class="recent" data-rq="'+esc(x)+'">'+ic("clock")+'<span class="t">'+esc(x)+'</span>'+ic("chev")+'</div>'}).join(""):'<p class="empty">Search across notes, tasks, files, recordings, transcripts and AI chats.</p>';return}
var r=collect(raw);
if(!r.out.length){box.innerHTML='<p class="empty">Nothing found for “'+esc(raw)+'”.<br><span class="hint">Try another word or pick a different filter.</span></p>';return}
box.innerHTML='<p class="hint">'+r.out.length+' result'+(r.out.length===1?"":"s")+'</p>'+r.out.map(function(x,i){var s=SRC[x.type];return '<div class="item" data-ri="'+i+'"><span class="ico '+s[2]+'">'+ic(s[1])+'</span><div class="grow"><b>'+esc(x.title)+'</b><span class="rsrc">'+s[0]+(x.when?" · "+esc(x.when):"")+'</span><span class="pre">'+snip(x.text,r.terms)+'</span></div><span class="chev">'+ic("chev")+'</span></div>'}).join("");
box._r=r.out}
$("qi").oninput=run;$("qi").onkeydown=function(e){if(e.key==="Enter")remember(this.value)};
var mc=$("qmic");if(mc)mc.onclick=function(){listenOnce(function(t){$("qi").value=t;remember(t);run()},function(m){toast(m)})};
$("qf").onclick=function(e){var b=e.target.closest("[data-qk]");if(!b)return;filter=b.getAttribute("data-qk");[].forEach.call($("qf").querySelectorAll("[data-qk]"),function(x){x.classList.toggle("on",x===b)});run()};

if(e.target.closest("#rclr")){S.recent=[];save();run();return}

if(!ri)return;var x=$("res")._r[+ri.getAttribute("data-ri")];remember($("qi").value);
if(x.type==="notes"||x.type==="files"){tab="notes";openId=x.id;moreSub=null}

else{if(x.extra){calSel=x.extra;calM=new Date(x.extra+"T00:00");calM.setDate(1)}tab="more";moreSub="cal"}
render()};
$("qi").focus();run()}

$("splash").innerHTML='<div class="sl"><span class="sg">'+logo(84)+'</span><div class="sn">Universal AI Notebook</div><div class="stg">Your Ideas. Smarter.</div><div class="ld"><i></i></div></div>';
