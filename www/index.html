<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jotter – notes, tasks, reminders</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#E9EFEC;--card:#fff;--ink:#14221E;--mute:#5C6E68;--line:#CBD7D2;--acc:#0F6B63;--accink:#fff;--hi:#F2C230;--bad:#B3321F}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101A17;--card:#18262A;--ink:#E6F0EC;--mute:#8CA19A;--line:#2A3D38;--acc:#4FC3B5;--accink:#08201C;--hi:#F2C230;--bad:#FF8A75}}
:root[data-theme="dark"]{--bg:#101A17;--card:#18262A;--ink:#E6F0EC;--mute:#8CA19A;--line:#2A3D38;--acc:#4FC3B5;--accink:#08201C;--hi:#F2C230;--bad:#FF8A75}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:30px;font-weight:800;margin:4px 0 2px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 16px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:640px}
nav button{flex:1;padding:14px 4px;background:none;border:0;color:var(--mute);font:600 14px inherit;font-family:inherit;border-top:3px solid transparent}
nav button.on{color:var(--ink);border-top-color:var(--hi)}
input,textarea,select,button{font-family:inherit;font-size:16px;color:var(--ink)}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:12px 16px;font-weight:600}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:10px 14px;color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}
.row>input{flex:1}
.item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:8px 0;display:flex;gap:12px;align-items:flex-start}
.item.note{flex-direction:column;gap:2px;cursor:pointer}
.item b{font-weight:600}
.pre{color:var(--mute);font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pin{border-left:4px solid var(--hi)}
.grow{flex:1;min-width:0}
.done .grow{text-decoration:line-through;color:var(--mute)}
.chk{width:24px;height:24px;margin-top:2px;accent-color:var(--acc);flex:none}
.x{background:none;border:0;color:var(--mute);padding:4px 8px;font-size:15px}
.late{color:var(--bad);font-weight:600}
.empty{color:var(--mute);padding:24px 4px}
h2{font-size:15px;margin:20px 0 4px;color:var(--mute);font-weight:600}
textarea{min-height:48vh;resize:vertical;line-height:1.5}
.bar{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.rec{background:var(--bad);color:#fff;border-color:var(--bad)}
#banner{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);max-width:616px;margin:0 auto;background:var(--hi);color:#14221E;border-radius:10px;padding:12px 14px;display:none;z-index:9}
#banner .row{margin-top:8px}
#banner button{background:#14221E;color:#fff;border:0;border-radius:8px;padding:8px 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.tile{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}.tile b{display:block;font-size:30px;font-weight:800}.tile span{color:var(--mute);font-size:14px}.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1;padding:10px 4px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-weight:600}.seg button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.hint{font-size:14px;color:var(--mute);margin:6px 0 0}
</style>
</head>
<body>
<div id="banner" role="alert"></div>
<div id="app"></div>
<nav><div id="tabs"></div></nav>
<script>
(function(){
var KEY="jotter-v1",tab="home",openId=null,q="",S={notes:[],tasks:[],rem:[],ev:[],al:[],cur:"all"};
try{var raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}sync()}
var SN=["beep","chime","pulse"],LN=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications,syncT;
function sync(){if(!LN)return;clearTimeout(syncT);syncT=setTimeout(doSync,400)}
async function doSync(){try{
var p=await LN.checkPermissions();if(p.display!=="granted"){p=await LN.requestPermissions();if(p.display!=="granted")return}
var pend=await LN.getPending();if(pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(function(n){return{id:n.id}})});
if(!window.alReady){window.alReady=1;
for(var si=0;si<3;si++){try{await LN.createChannel({id:"alarm_"+SN[si],name:"Alarm sound: "+SN[si],importance:5,vibration:true,sound:"alarm_"+SN[si]+".wav"})}catch(e){}}
try{await LN.registerActionTypes({types:[{id:"ALARM",actions:[{id:"snooze",title:"Snooze 5 min"},{id:"dismiss",title:"Dismiss"}]}]})}catch(e){}
try{LN.addListener("localNotificationActionPerformed",function(ev){if(ev.actionId==="snooze"){addSnooze((ev.notification.extra&&ev.notification.extra.label)||"Alarm")}})}catch(e){}}
var items=[],now=Date.now();
S.rem.forEach(function(r){if(r.done)return;var step=r.rep==="daily"?864e5:r.rep==="weekly"?6048e5:0,n=r.rep==="daily"?14:r.rep==="weekly"?8:1,t=r.at;
if(step)while(t<=now)t+=step;
for(var i=0;i<n;i++){if(t>now)items.push({title:"Reminder",body:r.t,at:t});t+=step}});
for(var d=0;d<14;d++){var day=new Date();day.setDate(day.getDate()+d);S.ev.forEach(function(e){if(!occurs(e,day))return;var t=new Date(ds(day)+"T"+e.tm).getTime()-e.pre*6e4;if(t>now)items.push({title:"Coming up",body:e.t+" at "+e.tm,at:t})})}
for(var d2=0;d2<14;d2++){var day2=new Date();day2.setDate(day2.getDate()+d2);S.al.forEach(function(a){if(!aOcc(a,day2))return;var t=new Date(ds(day2)+"T"+a.tm).getTime();if(t>now)items.push({title:"Alarm",body:a.t,at:t,ch:"alarm_"+(a.s||"beep")})})}
items.sort(function(a,b){return a.at-b.at});items=items.slice(0,100);
if(items.length)await LN.schedule({notifications:items.map(function(x,i){var o={id:i+1,title:x.title,body:x.body,schedule:{at:new Date(x.at),allowWhileIdle:true}};if(x.ch){o.channelId=x.ch;o.actionTypeId="ALARM";o.extra={label:x.body}}return o})});
}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function $(id){return document.getElementById(id)}
function fmt(t){return new Date(t).toLocaleString([], {weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}
function pad(n){return String(n).padStart(2,"0")}
function localInput(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())}

var TABS=[["home","Home"],["notes","Notes"],["tasks","Tasks"],["plan","Plan"],["search","Search"]];
function drawTabs(){$("tabs").innerHTML=TABS.map(function(t){return '<button data-t="'+t[0]+'" class="'+(tab===t[0]?"on":"")+'">'+t[1]+'</button>'}).join("")}
$("tabs").addEventListener("click",function(e){var t=e.target.getAttribute("data-t");if(t){tab=t;openId=null;render()}});

function render(){drawTabs();var f={notes:openId?editor:notesView,tasks:tasksView,home:homeView,plan:planView,search:searchView}[tab];f();window.scrollTo(0,0)}

/* NOTES */
function noteCard(n){return '<div class="item note'+(n.pin?' pin':'')+'" data-open="'+n.id+'"><b>'+esc(n.t||"Untitled note")+'</b><span class="pre">'+esc(n.b||"No text yet")+'</span></div>'}
function notesView(){
var list=S.notes.filter(inWs).sort(function(a,b){return (b.pin|0)-(a.pin|0)||b.ts-a.ts});
$("app").innerHTML='<h1>Notes</h1><p class="sub">'+list.length+' here</p>'+wsBar()+'<div class="row" style="margin-bottom:8px"><button class="btn" id="newn">New note</button><button class="ghost" id="sc">Scan</button></div>'+tplSel()+
(list.length?list.map(noteCard).join(""):'<p class="empty">No notes yet. Tap New note, then type or use the mic to speak.</p>');
bindWs();$("sc").onclick=scan;var tp=$("tp");tp.onchange=function(){if(!tp.value)return;var a=tp.value.split(":"),t=TPL[a[0]][+a[1]],n={id:uid(),t:t[0],b:t[1],pin:false,ts:Date.now(),w:a[0]};S.notes.push(n);save();openId=n.id;render()};
$("newn").onclick=function(){var n={id:uid(),t:"",b:"",pin:false,ts:Date.now(),w:nw()};S.notes.push(n);save();openId=n.id;render()};
$("app").onclick=function(e){var c=e.target.closest("[data-open]");if(c){openId=c.getAttribute("data-open");render()}};
}
var rec=null;
function editor(){
var n=S.notes.filter(function(x){return x.id===openId})[0];if(!n){openId=null;return notesView()}
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,NSR=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.SpeechRecognition;
$("app").innerHTML='<div class="bar"><button class="ghost" id="back">Back</button><button class="ghost" id="pinb">'+(n.pin?"Unpin":"Pin")+'</button>'+((SR||NSR)?'<button class="ghost" id="mic">Speak</button>':'')+'<button class="ghost" id="del">Delete</button></div>'+
'<input id="nt" placeholder="Title" value="'+esc(n.t)+'" style="font-weight:600;margin-bottom:8px"><textarea id="nb" placeholder="Write or speak your note">'+esc(n.b)+'</textarea><p class="hint" id="st">Saves automatically.</p>';
function touch(){n.t=$("nt").value;n.b=$("nb").value;n.ts=Date.now();save();$("st").textContent="Saved."}
$("nt").oninput=touch;$("nb").oninput=touch;
$("back").onclick=function(){stopRec();openId=null;render()};
$("pinb").onclick=function(){n.pin=!n.pin;save();render()};
$("del").onclick=function(){if(confirm("Delete this note?")){stopRec();S.notes=S.notes.filter(function(x){return x!==n});save();openId=null;render()}};
if(SR||NSR)$("mic").onclick=function(){
if(NSR){NSR.requestPermissions().then(function(p){if(p.speechRecognition!=="granted"){$("st").textContent="Allow the microphone for Jotter in phone Settings, then try again.";return}
return NSR.start({language:navigator.language||"en-US",maxResults:1,prompt:"Speak now",partialResults:false,popup:true}).then(function(r){var t=((r&&r.matches&&r.matches[0])||"").trim();if(t){$("nb").value+=($("nb").value&&!/\s$/.test($("nb").value)?" ":"")+t;touch()}})}).catch(function(){$("st").textContent="Voice input did not work. Try again."});return}
if(rec){stopRec();return}
try{rec=new SR();rec.continuous=true;rec.interimResults=false;rec.lang=navigator.language||"en-US";
rec.onresult=function(ev){for(var i=ev.resultIndex;i<ev.results.length;i++){if(ev.results[i].isFinal){var t=ev.results[i][0].transcript.trim();$("nb").value+=($("nb").value&&!/\s$/.test($("nb").value)?" ":"")+t;touch()}}};
rec.onend=function(){if(rec&&$("mic")){try{rec.start()}catch(e){}}};
rec.onerror=function(ev){$("st").textContent="Mic problem: "+ev.error+". Check microphone permission.";stopRec()};
rec.start();$("mic").textContent="Stop";$("mic").classList.add("rec");$("st").textContent="Listening… speak now."}catch(e){$("st").textContent="Voice input is not available here."}};
}
function stopRec(){if(rec){var r=rec;rec=null;try{r.stop()}catch(e){}}var m=$("mic");if(m){m.textContent="Speak";m.classList.remove("rec")}}

/* TASKS */
function splitTasks(text){
var t=text.replace(/^\s*(tomorrow|today|tonight|later|this (morning|afternoon|evening))?[, ]*(i|we)?\s*(need to|have to|must|should|want to|got to|gotta)\s+/i,"");
return t.split(/\s*(?:,|;|\n|\.\s|\band then\b|\band\b)\s*/i).map(function(s){return s.replace(/^(to|then)\s+/i,"").trim()}).filter(Boolean).map(function(s){return s.charAt(0).toUpperCase()+s.slice(1)});
}
function taskRow(t){return '<div class="item'+(t.done?' done':'')+'"><input type="checkbox" class="chk" data-c="'+t.id+'"'+(t.done?' checked':'')+' aria-label="Mark done"><div class="grow">'+esc(t.t)+'</div><button class="x" data-d="'+t.id+'" aria-label="Delete task">Delete</button></div>'}
function tasksView(){
var open=S.tasks.filter(function(t){return !t.done&&inWs(t)}),done=S.tasks.filter(function(t){return t.done&&inWs(t)});
$("app").innerHTML='<h1>Tasks</h1><p class="sub">'+open.length+' to do</p>'+wsBar()+'<div class="row"><input id="ti" placeholder="e.g. Tomorrow I need to buy cement, call my client and finish my report"><button class="btn" id="ta">Add</button></div><p class="hint">Type one task or several in a sentence. They are split into separate tasks.</p>'+
(open.length?open.map(taskRow).join(""):'<p class="empty">Nothing to do. Add a task above.</p>')+(done.length?'<h2>Done ('+done.length+')</h2>'+done.map(taskRow).join(""):"");
bindWs();function add(){var v=$("ti").value.trim();if(!v)return;splitTasks(v).forEach(function(s){S.tasks.push({id:uid(),t:s,done:false,w:nw()})});save();tasksView()}
$("ta").onclick=add;$("ti").onkeydown=function(e){if(e.key==="Enter")add()};
$("app").onclick=function(e){var c=e.target.getAttribute("data-c"),d=e.target.getAttribute("data-d");
if(c){S.tasks.forEach(function(t){if(t.id===c)t.done=!t.done});save();tasksView()}
if(d){S.tasks=S.tasks.filter(function(t){return t.id!==d});save();tasksView()}};
}

/* REMINDERS */
function remRow(r){var late=!r.done&&r.at<Date.now();return '<div class="item'+(r.done?' done':'')+'"><input type="checkbox" class="chk" data-c="'+r.id+'"'+(r.done?' checked':'')+' aria-label="Mark done"><div class="grow"><b>'+esc(r.t)+'</b><div class="'+(late?'late':'pre')+'">'+fmt(r.at)+(r.rep!=="once"?' · repeats '+r.rep:'')+(late?' · overdue':'')+'</div></div><button class="x" data-d="'+r.id+'" aria-label="Delete reminder">Delete</button></div>'}
function remV(){
var open=S.rem.filter(function(r){return !r.done}).sort(function(a,b){return a.at-b.at}),done=S.rem.filter(function(r){return r.done});
var d=new Date(Date.now()+3600000);d.setMinutes(0);
$("app").innerHTML='<h1>Reminders</h1><p class="sub">Alerts show while the app is open.</p><input id="rt" placeholder="e.g. Pay electricity bill" style="margin-bottom:8px"><div class="row" style="margin-bottom:8px"><input type="datetime-local" id="rw" value="'+localInput(d)+'"><select id="rr" style="width:auto"><option value="once">Once</option><option value="daily">Daily</option><option value="weekly">Weekly</option></select></div><button class="btn" id="ra">Add reminder</button>'+
(open.length?open.map(remRow).join(""):'<p class="empty">No reminders. Add one above.</p>')+(done.length?'<h2>Done ('+done.length+')</h2>'+done.map(remRow).join(""):"");
$("ra").onclick=function(){var t=$("rt").value.trim(),w=new Date($("rw").value).getTime();if(!t||isNaN(w)){alert("Enter a name and a date and time.");return}
S.rem.push({id:uid(),t:t,at:w,rep:$("rr").value,done:false,fired:false});save();
if(window.Notification&&Notification.permission==="default"){try{Notification.requestPermission()}catch(e){}}remView()};
$("app").onclick=function(e){var c=e.target.getAttribute("data-c"),d=e.target.getAttribute("data-d");
if(c){complete(c,true);remView()}
if(d){S.rem=S.rem.filter(function(r){return r.id!==d});save();remView()}};
}
function complete(id,toggle){S.rem.forEach(function(r){if(r.id!==id)return;
if(toggle&&r.done){r.done=false;r.fired=false;return}
if(r.rep==="once"){r.done=true}else{var step=r.rep==="daily"?86400000:604800000;while(r.at<=Date.now())r.at+=step;r.fired=false}});save()}
function snooze(id){S.rem.forEach(function(r){if(r.id===id){r.at=Date.now()+600000;r.fired=false}});save()}
function check(){
var now=Date.now(),due=S.rem.filter(function(r){return !r.done&&!r.fired&&r.at<=now});if(!due.length)return;
var r=due[0];r.fired=true;save();
if(window.Notification&&Notification.permission==="granted"){try{new Notification("Reminder",{body:r.t})}catch(e){}}
if(navigator.vibrate){try{navigator.vibrate([200,100,200])}catch(e){}}
var b=$("banner");b.style.display="block";b.innerHTML='<b>'+esc(r.t)+'</b><div class="row"><button data-s="'+r.id+'">Snooze 10 min</button><button data-f="'+r.id+'">Mark done</button></div>';
}
$("banner").onclick=function(e){var s=e.target.getAttribute("data-s"),f=e.target.getAttribute("data-f");
if(e.target.getAttribute("data-x"))$("banner").style.display="none";
var z=e.target.getAttribute("data-z");if(z){addSnooze(z);$("banner").style.display="none"}if(s)snooze(s);if(f)complete(f);if(s||f){$("banner").style.display="none";if(tab==="plan")render()}};
setInterval(check,15000);check();


/* SCHEDULE */
function ds(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function occurs(e,day){var d=ds(day);if(e.rep==="once")return e.d===d;if(d<e.d)return false;if(e.rep==="daily")return true;return new Date(e.d+"T00:00").getDay()===day.getDay()}
function schedV(){
var days=[];for(var i=0;i<7;i++){var d=new Date();d.setDate(d.getDate()+i);days.push(d)}
var h="";days.forEach(function(d,i){
var list=S.ev.filter(function(e){return occurs(e,d)}).sort(function(a,b){return a.tm<b.tm?-1:1});
var name=i===0?"Today":i===1?"Tomorrow":d.toLocaleDateString([], {weekday:"long"});
h+='<h2>'+name+' · '+d.toLocaleDateString([], {day:"numeric",month:"short"})+'</h2>'+(list.length?list.map(function(e){return '<div class="item"><div class="grow"><b>'+esc(e.t)+'</b><div class="pre">'+e.tm+(e.rep!=="once"?' · repeats '+e.rep:'')+(e.pre?' · alert '+e.pre+' min before':'')+'</div></div><button class="x" data-d="'+e.id+'" aria-label="Delete event">Delete</button></div>'}).join(""):'<p class="empty" style="padding:4px">Free</p>')});
$("app").innerHTML='<h1>Schedule</h1><p class="sub">Classes, meetings and appointments for the next 7 days.</p><input id="et" placeholder="e.g. Site meeting with Mr John" style="margin-bottom:8px"><div class="row" style="margin-bottom:8px"><input type="date" id="ed" value="'+ds(new Date())+'"><input type="time" id="em" value="09:00"></div><div class="row" style="margin-bottom:8px"><select id="er"><option value="once">Once</option><option value="daily">Every day</option><option value="weekly">Every week</option></select><select id="ep"><option value="0">At the time</option><option value="10">10 min before</option><option value="30">30 min before</option></select></div><button class="btn" id="ea">Add to schedule</button>'+h;
$("ea").onclick=function(){var t=$("et").value.trim();if(!t||!$("ed").value||!$("em").value){alert("Enter a title, date and time.");return}
S.ev.push({id:uid(),t:t,d:$("ed").value,tm:$("em").value,rep:$("er").value,pre:+$("ep").value,f:{}});save();
if(window.Notification&&Notification.permission==="default"){try{Notification.requestPermission()}catch(e){}}schedView()};
$("app").onclick=function(e){var d=e.target.getAttribute("data-d");if(d){S.ev=S.ev.filter(function(x){return x.id!==d});save();schedView()}};
}
function checkEv(){
var now=Date.now(),day=new Date();
for(var i=0;i<S.ev.length;i++){var e=S.ev[i];if(!occurs(e,day))continue;
var key=ds(day),at=new Date(key+"T"+e.tm).getTime()-e.pre*60000;
if(now>=at&&now<at+600000&&!(e.f&&e.f[key])){e.f=e.f||{};e.f[key]=1;save();
var msg=e.t+" at "+e.tm;
if(window.Notification&&Notification.permission==="granted"){try{new Notification("Coming up",{body:msg})}catch(x){}}
if(navigator.vibrate){try{navigator.vibrate([200,100,200])}catch(x){}}
var b=$("banner");b.style.display="block";b.innerHTML='<b>'+esc(msg)+'</b><div class="row"><button data-x="1">Dismiss</button></div>';return}}}
setInterval(checkEv,15000);checkEv();

/* WORKSPACES */
var WS=[["all","All"],["general","General"],["construction","Construction"],["business","Business"],["office","Office"],["education","Education"]];
var TPL={general:[["Daily journal","Date:\nWhat happened:\nTo do tomorrow:\n"]],
construction:[["Site report","Date:\nSite:\nWeather:\nWorkers present:\nWork done today:\nMaterials used:\nIssues:\n"],["Materials list","Item - Quantity - Supplier - Cost\n"],["Site observations","Date:\nLocation:\nObservation:\nAction needed:\n"]],
business:[["Customer order","Customer:\nPhone:\nItems:\nQuantity:\nPrice:\nPayment status:\nDelivery date:\n"],["Expenses","Date - Item - Amount\n"],["Supplier notes","Supplier:\nContact:\nProducts and prices:\n"]],
office:[["Meeting notes","Meeting:\nDate:\nAttendees:\nDiscussion:\nDecisions:\nAction items:\n"],["Project plan","Project:\nGoal:\nDeadline:\nSteps:\n"]],
education:[["Lecture notes","Course:\nTopic:\nKey points:\nQuestions:\n"],["Assignment","Course:\nTitle:\nDue date:\nRequirements:\nProgress:\n"],["Revision notes","Topic:\nSummary:\nThings to remember:\n"]]};
function nw(){return S.cur==="all"?"general":S.cur}
function inWs(x){return S.cur==="all"||(x.w||"general")===S.cur}
function wsBar(){return '<select id="ws" aria-label="Workspace" style="margin-bottom:12px">'+WS.map(function(w){return '<option value="'+w[0]+'"'+(S.cur===w[0]?' selected':'')+'>'+(w[0]==="all"?"All workspaces":w[1]+" workspace")+'</option>'}).join("")+'</select>'}
function bindWs(){var e=$("ws");if(e)e.onchange=function(){S.cur=e.value;save();render()}}
function tplSel(){var ks=S.cur==="all"?Object.keys(TPL):[S.cur],o='<option value="">Start from a template…</option>';ks.forEach(function(k){(TPL[k]||[]).forEach(function(t,i){o+='<option value="'+k+':'+i+'">'+esc(t[0])+(S.cur==="all"?" ("+k+")":"")+'</option>'})});return '<select id="tp">'+o+'</select>'}

/* HOME */
function homeView(){
var tk=S.tasks.filter(inWs),dn=tk.filter(function(t){return t.done}).length,op=tk.length-dn;
var nn=S.notes.filter(inWs).length,rm=S.rem.filter(function(r){return !r.done}).length,td=S.ev.filter(function(e){return occurs(e,new Date())}).length,al=S.al.filter(function(a){return a.on}).length;
function tile(n,l){return '<div class="tile"><b>'+n+'</b><span>'+l+'</span></div>'}
var nx=S.rem.filter(function(r){return !r.done&&r.at>Date.now()}).sort(function(a,b){return a.at-b.at})[0];
$("app").innerHTML='<h1>Today</h1><p class="sub">'+new Date().toLocaleDateString([], {weekday:"long",day:"numeric",month:"long"})+'</p>'+wsBar()+'<div class="grid">'+tile(op,"tasks left")+tile(dn,"tasks done")+tile(nn,"notes")+tile(td,"events today")+tile(rm,"reminders pending")+tile(al,"alarms on")+'</div>'+(nx?'<div class="item"><div class="grow"><b>Next reminder</b><div class="pre">'+esc(nx.t)+' · '+fmt(nx.at)+'</div></div></div>':'')+'<button class="btn" id="sc" style="margin-top:8px">Scan a document</button>';
bindWs();$("sc").onclick=scan}

/* PLAN (reminders, schedule, alarms) */
var sub="rem";
function seg(c){sub=c;var h='<div class="seg" id="seg">'+[["rem","Reminders"],["sched","Schedule"],["al","Alarms"]].map(function(x){return '<button data-p="'+x[0]+'" class="'+(c===x[0]?"on":"")+'">'+x[1]+'</button>'}).join("")+'</div>';$("app").insertAdjacentHTML("afterbegin",h);$("seg").onclick=function(e){var p=e.target.getAttribute("data-p");if(p){sub=p;render()}}}
function remView(){remV();seg("rem")}
function schedView(){schedV();seg("sched")}
function alarmView(){alarmV();seg("al")}
function planView(){({rem:remView,sched:schedView,al:alarmView})[sub]()}

/* ALARMS */
function addSnooze(z){var zt=new Date(Date.now()+300000);S.al.push({id:uid(),t:z,tm:pad(zt.getHours())+":"+pad(zt.getMinutes()),d:ds(zt),rep:"once",on:true,f:{},s:"beep",c:Date.now()});save()}
function aOcc(a,day){if(!a.on)return false;var d=ds(day);if(a.rep==="once")return a.d===d;if(a.rep==="daily")return true;var w=day.getDay();return w>0&&w<6}
function alarmV(){
S.al.forEach(function(a){if(a.rep==="once"&&a.on&&new Date(a.d+"T"+a.tm).getTime()<Date.now()-120000)a.on=false});
var list=S.al.slice().sort(function(a,b){return a.tm<b.tm?-1:1}),rn={once:"Once",daily:"Every day",weekdays:"Mon to Fri"};
$("app").innerHTML='<h1>Alarms</h1><p class="sub">Rings as a loud notification, even when the app is closed.</p><input id="at" placeholder="Label, e.g. Wake up" style="margin-bottom:8px"><div class="row" style="margin-bottom:8px"><input type="time" id="am" value="06:30"><select id="ar"><option value="once">Once</option><option value="daily">Every day</option><option value="weekdays">Mon to Fri</option></select></div><select id="as" aria-label="Alarm sound" style="margin-bottom:8px"><option value="beep">Sound: Beep</option><option value="chime">Sound: Chime</option><option value="pulse">Sound: Pulse</option></select><button class="btn" id="aa">Add alarm</button>'+
(list.length?list.map(function(a){return '<div class="item'+(a.on?'':' done')+'"><input type="checkbox" class="chk" data-c="'+a.id+'"'+(a.on?' checked':'')+' aria-label="Alarm on"><div class="grow"><b style="font-size:22px">'+a.tm+'</b><div class="pre">'+esc(a.t||"Alarm")+' · '+rn[a.rep]+' · '+(a.s||'beep')+'</div></div><button class="x" data-d="'+a.id+'" aria-label="Delete alarm">Delete</button></div>'}).join(""):'<p class="empty">No alarms yet.</p>')+histHtml();
function histHtml(){var h=[];for(var k=0;k<=3;k++){var dy=new Date();dy.setDate(dy.getDate()-k);S.al.forEach(function(a){if(a.rep==="once"||!a.on)return;var t=new Date(ds(dy)+"T"+a.tm).getTime();if(t<Date.now()&&t>=(a.c||0)&&aOcc(a,dy))h.push({t:t,l:a.t})})}
h.sort(function(x,y){return y.t-x.t});if(!h.length)return"";return '<h2>Rang recently</h2>'+h.slice(0,8).map(function(x){return '<div class="item"><div class="grow"><b>'+esc(x.l)+'</b><div class="pre">'+fmt(x.t)+'</div></div></div>'}).join("")}
function nextDay(m){var d=new Date();if(m<=pad(d.getHours())+":"+pad(d.getMinutes()))d.setDate(d.getDate()+1);return ds(d)}
$("aa").onclick=function(){var m=$("am").value;if(!m){alert("Pick a time.");return}S.al.push({id:uid(),t:$("at").value.trim()||"Alarm",tm:m,d:nextDay(m),rep:$("ar").value,on:true,f:{},s:$("as").value,c:Date.now()});save();alarmView()};
$("app").onclick=function(e){var c=e.target.getAttribute("data-c"),d=e.target.getAttribute("data-d");
if(c){S.al.forEach(function(a){if(a.id===c){a.on=!a.on;if(a.on)a.d=nextDay(a.tm)}});save();alarmView()}
if(d){S.al=S.al.filter(function(a){return a.id!==d});save();alarmView()}};
}
function checkAl(){var now=Date.now(),day=new Date(),key=ds(day);
for(var i=0;i<S.al.length;i++){var a=S.al[i];if(!aOcc(a,day))continue;var at=new Date(key+"T"+a.tm).getTime();
if(now>=at&&now<at+120000&&!(a.f&&a.f[key])){a.f=a.f||{};a.f[key]=1;save();
if(navigator.vibrate){try{navigator.vibrate([500,200,500,200,500])}catch(x){}}
var b=$("banner");b.style.display="block";b.innerHTML='<b>Alarm: '+esc(a.t)+' · '+a.tm+'</b><div class="row"><button data-z="'+esc(a.t)+'">Snooze 5 min</button><button data-x="1">Dismiss</button></div>';return}}}
setInterval(checkAl,15000);checkAl();

/* SCANNER */
function msg(t){var b=$("banner");b.style.display="block";b.innerHTML="<b>"+esc(t)+'</b><div class="row"><button data-x="1">OK</button></div>'}
var OCRP=location.origin+"/ocr/";
function loadOcr(){return new Promise(function(res,rej){if(window.Tesseract)return res();
function cdn(){var c=document.createElement("script");c.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";c.onload=res;c.onerror=function(){rej(new Error("net"))};document.head.appendChild(c)}
var l=document.createElement("script");l.src=OCRP+"tesseract.min.js";l.onload=function(){window.OCRLOCAL=1;res()};l.onerror=cdn;document.head.appendChild(l)})}
function prep(src){return new Promise(function(res){var im=new Image();im.onload=function(){var m=Math.max(im.width,im.height),k=m>2200?2200/m:1,w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement("canvas");c.width=w;c.height=h;var x=c.getContext("2d");x.drawImage(im,0,0,w,h);
try{var d=x.getImageData(0,0,w,h),a=d.data,lo=255,hi=0,n,g;for(n=0;n<a.length;n+=4){g=a[n]*.3+a[n+1]*.59+a[n+2]*.11;a[n]=a[n+1]=a[n+2]=g;if(g<lo)lo=g;if(g>hi)hi=g}var sc=255/Math.max(1,hi-lo);for(n=0;n<a.length;n+=4){g=(a[n]-lo)*sc;a[n]=a[n+1]=a[n+2]=g}x.putImageData(d,0,0)}catch(e){}
res(c.toDataURL("image/png"))};im.onerror=function(){res(src)};im.src=src})}
function scan(){
var CAM=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Camera;
if(CAM){CAM.getPhoto({quality:85,resultType:"dataUrl",source:"PROMPT",correctOrientation:true}).then(function(p){ocr(p.dataUrl)}).catch(function(){});return}
var i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=function(){var f=i.files[0];if(!f)return;var r=new FileReader();r.onload=function(){ocr(r.result)};r.readAsDataURL(f)};i.click()}
function ocr(img,retry){
msg("Reading text… this can take a minute.");
loadOcr().then(function(){return prep(img)}).then(function(im){
var o=window.OCRLOCAL?{workerPath:OCRP+"worker.min.js",corePath:OCRP,langPath:OCRP+"lang",workerBlobURL:false}:{};
return Tesseract.recognize(im,"eng",o)}).then(function(r){
var text=((r.data&&r.data.text)||"").trim();if(!text){msg("No text found. Try a clearer, well-lit photo.");return}
var n={id:uid(),t:"Scan "+new Date().toLocaleDateString(),b:text,pin:false,ts:Date.now(),w:nw()};S.notes.push(n);save();
$("banner").style.display="none";openId=n.id;tab="notes";render()
}).catch(function(){if(window.OCRLOCAL&&!retry){window.OCRLOCAL=0;ocr(img,1);return}msg("Could not read the image. Check your internet and try again.")})}

/* SEARCH */
function searchView(){
$("app").innerHTML='<h1>Search</h1><p class="sub">Notes, tasks, reminders and schedule in one place.</p><input id="qi" type="search" placeholder="Try: cement" value="'+esc(q)+'"><div id="res"></div>';
function run(){q=$("qi").value;var k=q.trim().toLowerCase(),h="";
if(!k){$("res").innerHTML='<p class="empty">Type a word to search everything you have saved.</p>';return}
var n=S.notes.filter(function(x){return (x.t+" "+x.b).toLowerCase().indexOf(k)>-1}),
t=S.tasks.filter(function(x){return x.t.toLowerCase().indexOf(k)>-1}),
r=S.rem.filter(function(x){return x.t.toLowerCase().indexOf(k)>-1}),v=S.ev.filter(function(x){return x.t.toLowerCase().indexOf(k)>-1});
if(n.length)h+='<h2>Notes ('+n.length+')</h2>'+n.map(noteCard).join("");
if(t.length)h+='<h2>Tasks ('+t.length+')</h2>'+t.map(function(x){return '<div class="item'+(x.done?' done':'')+'"><div class="grow">'+esc(x.t)+'</div></div>'}).join("");
if(r.length)h+='<h2>Reminders ('+r.length+')</h2>'+r.map(function(x){return '<div class="item'+(x.done?' done':'')+'"><div class="grow"><b>'+esc(x.t)+'</b><div class="pre">'+fmt(x.at)+'</div></div></div>'}).join("");
if(v.length)h+='<h2>Schedule ('+v.length+')</h2>'+v.map(function(x){return '<div class="item"><div class="grow"><b>'+esc(x.t)+'</b><div class="pre">'+x.d+" "+x.tm+'</div></div></div>'}).join("");
$("res").innerHTML=h||'<p class="empty">Nothing found for “'+esc(q)+'”.</p>'}
$("qi").oninput=run;run();
$("app").onclick=function(e){var c=e.target.closest("[data-open]");if(c){tab="notes";openId=c.getAttribute("data-open");render()}};
}
render();sync();
})();
</script>
